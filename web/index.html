    <!-- 顶栏 LOGO 预加载（2026-11-27）：LOGO 在窄屏 LOGO 行与宽屏 LeftRail 两处条件挂载，
         跨 1780px 断点时 React 会卸载一处、挂载另一处，产生全新的 <img> 元素；
         /logo.svg 是非哈希公共资源，服务端发 no-cache/must-revalidate，新 img 每次都要
         联网再验证才画得出，看起来就像重新加载。预加载让图片在页面打开时就进内存缓存，
         之后无论哪处挂载都直接走缓存、不再发请求、不闪。只预加载，不改图片本身与 favicon。 -->
    <link rel="preload" as="image" href="/logo.svg" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "杂盒 ZaBox 是什么？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "杂盒 ZaBox 是个人资料整理收录、任务计划与日程处理的新标签页主页：网站分门别类收好，预设导航选一个就能用，还有待办、组合卡、Dock 栏、数据一键回退和同步。"
          }
        },
        {
          "@type": "Question",
          "name": "杂盒免费吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "免费。在 Microsoft Edge 商店搜索 ZaBox 即可免费安装扩展，也可直接打开 zahe.hiitun.top/web/ 使用网页版。"
          }
        },
        {
          "@type": "Question",
          "name": "我的数据存在哪里？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "默认只存在你自己的浏览器本地。同步是可选的，走你自己的 GitHub 或 Gitee 私有仓库，不经过开发者服务器。"
          }
        },
        {
          "@type": "Question",
          "name": "预设导航有哪些？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "设计师导航、程序员导航、娱乐电影导航，选一个就能用；也可以在「我的」预设里按自己的需要整理。"
          }
        },
        {
          "@type": "Question",
          "name": "能在手机、电脑、平板上同步吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "可以。杂盒支持手机、电脑、平板三端使用，任务和日程走到哪跟到哪。"
          }
        },
        {
          "@type": "Question",
          "name": "Edge 扩展怎么安装？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "打开 Microsoft Edge 商店，搜索 ZaBox，免费安装。装好后打开新标签页就是杂盒主页；在任意网页右键「添加到杂盒主页」，也可以把当前网站收进来。"
          }
        }
      ]
